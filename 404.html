<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found · Gericke Hoeksema</title>
    <meta name="robots" content="noindex">
    <script>
        // Safety net for the emergency QR code: any /medical variant goes to the emergency page.
        if (/^\/medical(\.html)?\/?$/i.test(window.location.pathname)) {
            window.location.replace('/medical/');
        }
    </script>
    <style>
        :root {
            color-scheme: dark light;
            --bg: light-dark(#f7f1e6, #0c1624);
            --text: light-dark(#1c2631, #ece7dd);
            --text-2: light-dark(#4a5563, #a9b3c1);
            --accent: light-dark(#a3590a, #f2a541);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }
        h1 {
            color: var(--accent);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        p {
            color: var(--text-2);
            margin-bottom: 1.5rem;
        }
        a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Page not found</h1>
        <p>That trail doesn't go anywhere.</p>
        <p><a href="/">Return to Home</a></p>
    </div>
</body>
</html>
